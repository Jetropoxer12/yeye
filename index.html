<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>booiii</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      margin: 0;
    }

    #dialog {
      background-color: #1e1e1e;
      padding: 50px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
      position: relative;
      width: 600px;
      height: 400px;
    }

    h2 {
      font-size: 36px;
      margin-bottom: 40px;
    }

    button {
      position: absolute;
      padding: 20px 40px;
      font-size: 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      width: 160px;
      height: 60px;
      transition: left 0.3s ease, top 0.3s ease;
      user-select: none;
      transform: none;
      box-sizing: border-box;
    }

    #yesBtn {
      background-color: #4caf50;
      color: white;
      left: 50%;
      bottom: 40px;
      margin-left: -80px;
    }

    #noBtn {
      background-color: #f44336;
      color: white;
      left: 20px;
      bottom: 40px;
      top: auto;
      right: auto;
    }

    #daiBtn {
      background-color: #ff9800;
      color: white;
      right: 30px;
      bottom: 50px;
      left: auto;
      top: auto;
    }

    #message {
      margin-top: 20px;
      font-size: 28px;
      text-align: center;
      min-height: 40px;
    }
  </style>
</head>
<body>
  <div id="dialog">
    <h2>laro boi</h2>
    <button id="yesBtn">tara</button>
    <button id="noBtn">yokoo</button>
    <button id="daiBtn">wag na</button>
    <div id="message"></div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const daiBtn = document.getElementById("daiBtn");
    const dialog = document.getElementById("dialog");
    const message = document.getElementById("message");

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function showMessage(words) {
      message.textContent = '';
      for (const word of words) {
        message.textContent += word + ' ';
        await delay(500);
      }
    }

    yesBtn.onclick = () => {
      dialog.style.display = "none";
      alert("yunnn, open open");
    };

    function dodgeButton(button) {
      const maxX = dialog.clientWidth - button.offsetWidth;
      const maxY = dialog.clientHeight - button.offsetHeight;

      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);

      button.style.left = `${randomX}px`;
      button.style.top = `${randomY}px`;
    }

    ["mouseenter", "click"].forEach(eventType => {
      noBtn.addEventListener(eventType, () => dodgeButton(noBtn));
      daiBtn.addEventListener(eventType, () => dodgeButton(daiBtn));
    });

    daiBtn.addEventListener("dblclick", () => {
      showMessage(["Dai", "pwede", "ra", "lagi", "bitaw", ":)"]);
    });
  </script>
</body>
</html>
